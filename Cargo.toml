[package]
categories = ["development-tools"]
description = "GraphQL SDL -> Rust/TypeScript/OpenAPI RPC code generator"
edition = "2021"
exclude = [".cargo", ".vscode"]
keywords = ["graphql", "codegen", "rpc", "openapi", "axum"]
license = "MIT"
name = "graphql-rpcgen"
repository = "https://github.com/volkagames/graphql-rpcgen"
version = "0.15.0"

[dependencies]
erris = "3"
graphql-parser = "0.4"
mustache = "0.9.0"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = { version = "1.2.3", default-features = false, features = [
    "parse",
    "display",
    "serde",
] }

# What the *generated* Rust reaches for, not what the generator needs. The
# `*_wire` tests compile generated code in scratch projects and pin their
# versions to this lockfile, so the set has to resolve here even though no
# line of `src/` mentions any of it. The runtime itself is `treat`'s
# (`treat::rpc`): `rpc-server` for the server target, `rpc-client` for the
# client, `rpc-stream` for SSE and raw bodies, `validator` for `@pattern` —
# see "What the generated Rust needs on the other side" in the README.
# `reqwest` and `tokio` are the wire tests' drivers' alone, for requests the
# generated client would never send.
[dev-dependencies]
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
derive_more = { version = "2", features = [
    "from",
    "into",
    "display",
    "as_ref",
] }
error_set = "0.9"
# Not the generated code's: `tests/golden.rs` keeps every target's output
# with it.
insta = "1.49"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
treat = { version = "0.27", features = [
    "rpc-client",
    "rpc-server",
    "rpc-status-header",
    "rpc-stream",
    "validator",
] }
uuid = { version = "1", features = ["serde"] }
validator = { version = "0.21", features = ["derive"] }

# No deliberate panic reaches a generator run: a failure is a `CompileError`
# that names the file and the position. Tests included — a test that `?`s says
# what broke. The same block the generated projects carry.
[lints.clippy]
expect_used = "deny"
panic = "deny"
todo = "deny"
unreachable = "deny"
unwrap_used = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
panic_in_result_fn = "deny"
string_slice = "deny"
get_unwrap = "deny"
unwrap_in_result = "deny"
missing_panics_doc = "deny"
exit = "deny"
